# Render Blueprint — the whole deployment, in the repository rather than in a
# dashboard nobody else can see. https://render.com/docs/blueprint-spec
#
# Three resources: a Postgres database, the Rails API, and the React app as a
# static site that proxies /api through to the API. That proxy is the point —
# it means the deployed app is same-origin exactly like the development one, so
# the client sends the same relative paths, CORS is never involved, and there is
# no branch on the environment in the code.
#
# Paths below are all relative to the repository root. `rootDir` is deliberately
# unset: `dockerfilePath`, `dockerContext` and `staticPublishPath` are specified
# as repo-root-relative, and mixing the two conventions is how you get a build
# that looks for web/web/dist.

databases:
  - name: salary-management-db
    databaseName: salary_management
    user: salary_management
    plan: free
    region: oregon

services:
  # ---------------------------------------------------------------- API ----
  - type: web
    name: salary-management-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api

    # There is deliberately no `preDeployCommand` here: Render rejects one on a
    # free instance, and the free plan also has no shell, so there is nowhere to
    # run `db:seed` from by hand either.
    #
    # api/bin/docker-entrypoint covers it. It runs `db:prepare` whenever the
    # container is starting the server, which on a database Render has just
    # created loads structure.sql and then seeds the 10,000-employee
    # organisation — about 13 seconds on a developer machine, longer on 0.1 CPU.
    # It happens before the port is bound, so the first deploy sits in "port
    # scan" for a few minutes; that is the seed, not a hang. Every later start,
    # including each wake from spin-down, is a migration check and nothing more.

    # Answers 200 once the app boots with no exceptions. `config.force_ssl`
    # turns this into a 301 over plain HTTP, which Render accepts: 2xx and 3xx
    # both count as healthy.
    healthCheckPath: /up

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salary-management-db
          property: connectionString

      # Rails will not boot in production without one. Generated by Render and
      # never seen by this repository, which is why config/master.key can stay
      # out of version control: nothing here reads encrypted credentials.
      - key: SECRET_KEY_BASE
        generateValue: true

      # Pinned to 1 on purpose. config/puma.rb falls back to
      # `Concurrent.physical_processor_count`, which on a shared instance
      # reports the host's cores rather than the 0.1 CPU this container is
      # entitled to — that is a fork bomb into a 512 MB memory limit.
      - key: WEB_CONCURRENCY
        value: 1

      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info

  # ---------------------------------------------------------------- Web ----
  - type: web
    name: salary-management-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist

    routes:
      # Order matters: Render takes the first rule that matches, so the API
      # proxy has to come before the catch-all or every request would be
      # answered with index.html.
      #
      # ⚠ The host below must match what Render actually gave the API service.
      # If `salary-management-api` was already taken, the URL gets a random
      # suffix and this has to be corrected — check it after the first deploy.
      - type: rewrite
        source: /api/*
        destination: https://salary-management-api.onrender.com/api/*

      # Client-side routing. /employees/42 is a React Router path, not a file,
      # and without this a refresh on that URL is a 404 from the CDN. Render
      # does not apply rules to paths where a file exists, so the built assets
      # are still served normally.
      - type: rewrite
        source: /*
        destination: /index.html
