inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "vendor/**/*"
    - "tmp/**/*"

# Long, descriptive example names read better than short cryptic ones.
RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Max: 5

# Request and integration specs describe a behaviour of the system, not a
# class. Naming a class in the describe would be less accurate, not more.
RSpec/DescribeClass:
  Exclude:
    - "spec/requests/**/*"
    - "spec/integration/**/*"
