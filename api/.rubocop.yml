inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "vendor/**/*"
    - "tmp/**/*"

# Long, descriptive example names read better than short cryptic ones.
RSpec/ExampleLength:
  Max: 15

RSpec/MultipleExpectations:
  Max: 5
